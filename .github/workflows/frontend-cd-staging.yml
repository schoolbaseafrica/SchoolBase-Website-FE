# Deploy frontend to staging (staging.schoolbase.africa -> port 3003)
name: Frontend Deploy (Staging)

on:
  push:
    branches:
      - staging
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  PM2_APP_NAME: fe-staging-schoolbase
  APP_PORT: "3003"
  DEPLOY_PATH: /home/ubuntu/open-school/staging/open-school-portal-FE

jobs:
  primary-deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for vulnerabilities
        run: |
          echo "Checking for high/critical vulnerabilities..."
          if pnpm audit --audit-level high; then
            echo "✅ No high or critical vulnerabilities found"
          else
            echo "❌ High or critical vulnerabilities detected! Deployment blocked."
            exit 1
          fi

      - name: Build app
        run: pnpm run build

      - name: Prepare SSH key
        id: ssh-key
        run: |
          KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          if echo "$KEY" | grep -q "BEGIN.*KEY"; then
            echo "$KEY" > deploy_key.pem
          else
            echo "$KEY" | base64 -d > deploy_key.pem
          fi
          chmod 600 deploy_key.pem
          echo "path=$(pwd)/deploy_key.pem" >> $GITHUB_OUTPUT

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ${{ steps.ssh-key.outputs.path }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            # Force server to match origin/staging (discard any local changes so pull never blocks)
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging
            if ! command -v pnpm &> /dev/null; then
              echo "pnpm not found, installing..."
              curl -fsSL https://get.pnpm.io/install.sh | sh -
              export PATH="$HOME/.local/share/pnpm:$PATH"
              source ~/.bashrc || true
            fi
            pnpm install --frozen-lockfile
            pnpm run build
            if [ ! -d ".next" ]; then
              echo "Build failed - .next directory not found"
              exit 1
            fi
            pm2 reload ${{ env.PM2_APP_NAME }} || pm2 start "pnpm start -p ${{ env.APP_PORT }}" --name ${{ env.PM2_APP_NAME }}
            pm2 save
            echo "Staging frontend deployed (staging.schoolbase.africa)"
