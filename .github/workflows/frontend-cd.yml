name: Frontend Deploy Pipeline

on:
  push:
    branches: 
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PM2_APP_NAME: fe-prod-schoolbase
  APP_PORT: 3002

jobs:
  # Primary Deploy - tries GitHub runners first
  primary-deploy:
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for vulnerabilities
        run: |
          echo "Checking for high/critical vulnerabilities..."
          if pnpm audit --audit-level high; then
            echo "✅ No high or critical vulnerabilities found"
          else
            echo "❌ High or critical vulnerabilities detected! Deployment blocked."
            exit 1
          fi

      - name: Build app
        run: pnpm run build

      - name: Prepare SSH key
        id: ssh-key
        run: |
          KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          if echo "$KEY" | grep -q "BEGIN.*KEY"; then
            echo "$KEY" > deploy_key.pem
          else
            echo "$KEY" | base64 -d > deploy_key.pem
          fi
          chmod 600 deploy_key.pem
          echo "path=$(pwd)/deploy_key.pem" >> $GITHUB_OUTPUT

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ${{ steps.ssh-key.outputs.path }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/ubuntu/open-school/prod/open-school-portal-FE
            
            # Ensure we're on main branch and get latest code
            git checkout main
            git pull origin main
            
            # Install pnpm if not available
            if ! command -v pnpm &> /dev/null; then
              echo "pnpm not found, installing..."
              curl -fsSL https://get.pnpm.io/install.sh | sh -
              export PATH="$HOME/.local/share/pnpm:$PATH"
              source ~/.bashrc || true
            fi
            
            # Install dependencies
            pnpm install --frozen-lockfile
            
            # Build application on server
            pnpm run build
            
            # Verify build exists
            if [ ! -d ".next" ]; then
              echo "Build failed - .next directory not found"
              exit 1
            fi
            
            # Reload PM2 app (zero downtime) or start if not running
            pm2 reload ${{ env.PM2_APP_NAME }} || pm2 start "pnpm start -p ${{ env.APP_PORT }}" --name ${{ env.PM2_APP_NAME }}
            pm2 save

      - id: check
        run: echo "success=true" >> $GITHUB_OUTPUT

  # Fallback Deploy - uses self-hosted runner if GitHub runners fail
  fallback-deploy:
    runs-on: [self-hosted, emerj-runner]
    needs: primary-deploy
    if: failure()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for vulnerabilities
        run: |
          echo "Checking for high/critical vulnerabilities..."
          if pnpm audit --audit-level high; then
            echo "✅ No high or critical vulnerabilities found"
          else
            echo "❌ High or critical vulnerabilities detected! Deployment blocked."
            exit 1
          fi

      - name: Build app
        run: pnpm run build

      - name: Prepare SSH key
        id: ssh-key
        run: |
          KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          if echo "$KEY" | grep -q "BEGIN.*KEY"; then
            echo "$KEY" > deploy_key.pem
          else
            echo "$KEY" | base64 -d > deploy_key.pem
          fi
          chmod 600 deploy_key.pem
          echo "path=$(pwd)/deploy_key.pem" >> $GITHUB_OUTPUT

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ${{ steps.ssh-key.outputs.path }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/ubuntu/open-school/prod/open-school-portal-FE
            
            # Ensure we're on main branch and get latest code
            git checkout main
            git pull origin main
            
            # Install pnpm if not available
            if ! command -v pnpm &> /dev/null; then
              echo "pnpm not found, installing..."
              curl -fsSL https://get.pnpm.io/install.sh | sh -
              export PATH="$HOME/.local/share/pnpm:$PATH"
              source ~/.bashrc || true
            fi
            
            # Install dependencies
            pnpm install --frozen-lockfile
            
            # Build application on server
            pnpm run build
            
            # Verify build exists
            if [ ! -d ".next" ]; then
              echo "Build failed - .next directory not found"
              exit 1
            fi
            
            # Reload PM2 app (zero downtime) or start if not running
            pm2 reload ${{ env.PM2_APP_NAME }} || pm2 start "pnpm start -p ${{ env.APP_PORT }}" --name ${{ env.PM2_APP_NAME }}
            pm2 save